name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write      # Required for Pages
  id-token: write   # Required for Pages

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Backend Setup (Tests)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # 2. Frontend Setup (Build)
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build  # Outputs to src/dashboard

      # 3. Run Verification Tests
      - name: Run Integration Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/test_netting_scenario.py
          pytest tests/test_settlement.py

      # 4. Upload Pages Artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: src/dashboard

  deploy-to-pages:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
